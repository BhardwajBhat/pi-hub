<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi hub</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; color: #111; background: white; }
a { color: #523c88; }
button, input, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
.app { display: grid; grid-template-columns: 260px minmax(0, 1fr); height: 100vh; height: 100dvh; }
aside { padding: 24px 20px; border-right: 1px solid #999; overflow: auto; }
aside h1 { margin-top: 14px; }
aside h2 { margin-top: 48px; }
nav a { display: block; padding: 9px 0; overflow-wrap: anywhere; }
nav a[aria-current] { font-weight: bold; color: #111; }
.new-button { width: 100%; }
.new-form { margin-top: 16px; }
.new-form label { display: block; margin: 12px 0; }
.new-form input, .new-form select { display: block; width: 100%; margin-top: 4px; padding: 5px; }
nav small { display: block; color: #666; font-weight: normal; }
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
header { padding: 20px 24px 16px; border-bottom: 1px solid #999; }
header h2 { margin: 0 0 8px; overflow-wrap: anywhere; }
.meta { line-height: 1.5; overflow-wrap: anywhere; }
#messages { flex: 1; overflow: auto; padding: 12px 24px 24px; overscroll-behavior: contain; }
.message { margin: 24px 0 32px; max-width: 90ch; }
.message h3 { font-size: 1rem; margin: 0 0 8px; }
.message-text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
.message-text code, pre { font-size: .9em; }
details { margin: 12px 0; }
summary { cursor: pointer; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f6f6f6; padding: 12px; max-height: 26rem; overflow: auto; }
footer { border-top: 1px solid #999; padding: 16px 24px; }
#composer { display: flex; align-items: stretch; gap: 10px; }
textarea { width: 100%; resize: vertical; min-height: 72px; padding: 10px; }
#composer button { padding: 8px 20px; }
#status { margin: 10px 0 0; min-height: 1.2em; }
#error { color: #a00000; white-space: pre-wrap; overflow-wrap: anywhere; }
#notice { margin: 0; }
#dialogs fieldset { margin: 16px 0; }
#dialogs textarea, #dialogs select, #dialogs input { display: block; max-width: 100%; margin: 10px 0; }
#mobile-toggle { display: none; }
[hidden] { display: none !important; }
@media (max-width: 700px) {
  .app { grid-template-columns: 190px minmax(0, 1fr); }
  aside { padding: 16px 12px; }
  header, footer { padding: 16px; }
  #messages { padding: 8px 16px; }
}
@media (max-width: 480px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  aside { display: none; border-right: 0; border-bottom: 1px solid #999; max-height: 45dvh; }
  .app.menu-open { grid-template-rows: auto minmax(0, 1fr); }
  .menu-open aside { display: block; }
  aside h2 { margin-top: 20px; }
  #mobile-toggle { display: inline-block; margin-bottom: 14px; }
  #composer button { padding: 8px 12px; }
}
</style>
</head>
<body>
<div class="app" id="app">
<aside aria-label="Conversations">
<a href="/">pi hub</a>
<h1>Session</h1>
<p id="connection" role="status">Connecting…</p>
<h2>Conversations</h2>
<button class="new-button" id="new-toggle" aria-expanded="false">New conversation</button>
<form class="new-form" id="new-form" hidden>
<label>Name <input name="name" placeholder="Main conversation" maxlength="120"></label>
<label>Machine <select name="machine" id="machine"><option value="">this machine (hub)</option></select></label>
<label>Directory <input name="cwd" placeholder="~ (home directory)" autocapitalize="off" spellcheck="false"></label>
<button type="submit">Create</button>
</form>
<nav id="conversations" aria-label="Conversation list"></nav>
</aside>
<main>
<header>
<button id="mobile-toggle" aria-expanded="false">Conversations</button>
<h2 id="title">Main conversation</h2>
<div class="meta" id="meta"></div>
</header>
<section id="messages" aria-label="Messages" tabindex="0">
<p id="notice">Create a conversation to begin.</p>
<div id="transcript"></div>
<div id="dialogs"></div>
</section>
<footer>
<p id="error" role="alert" hidden></p>
<form id="composer">
<label for="text" hidden>Message</label>
<textarea id="text" name="text" placeholder="Send a message…" required disabled></textarea>
<button id="send" disabled>Send</button>
<button id="stop" type="button" hidden>Stop</button>
</form>
<p id="status" role="status">Choose a conversation or create a new one.</p>
</footer>
</main>
</div>
<noscript><p>This chat requires JavaScript.</p></noscript>
<script>
'use strict';
const $ = id => document.getElementById(id);
let selected = new URLSearchParams(location.search).get('c');
let busy = false, sending = false, polling = false, signature = '', dialogSignature = '';
let requestError = '', backendError = '', connectionError = '';
const drafts = new Map();
function showError() {
  $('error').textContent = requestError || connectionError || backendError;
  $('error').hidden = !$('error').textContent;
}
async function api(path, data) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 45000);
  try {
    const response = await fetch(path, data === undefined
      ? {signal: controller.signal}
      : {method: 'POST', body: new URLSearchParams(data), signal: controller.signal});
    if (response.status === 401) throw new Error('Authentication required. Reload to sign in.');
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'Request failed');
    return result;
  } finally { clearTimeout(timer); }
}
function element(tag, text, className) {
  const el = document.createElement(tag);
  if (text !== undefined) el.textContent = text;
  if (className) el.className = className;
  return el;
}
function disclosure(label, text) {
  const d = element('details');
  d.append(element('summary', label), element('pre', text));
  return d;
}
function renderMessage(message, index, partial = false) {
  const article = element('article', undefined, 'message');
  const role = message.role;
  if (role === 'system' || (role === 'custom' && message.display === false)) return null;
  const label = role === 'user' ? 'You' : role === 'assistant' ? 'Assistant' :
    role === 'toolResult' ? (message.toolName || 'Tool') : role === 'bashExecution' ? 'Shell' : 'Notice';
  article.append(element('h3', label + (partial ? ' …' : '')));
  if (role === 'toolResult') {
    const content = message.content || [];
    article.append(disclosure(message.isError ? 'Tool failed — show result' : 'Show result',
      typeof content === 'string' ? content : content.filter(b => b.type === 'text').map(b => b.text).join('\n')));
  } else if (role === 'bashExecution') {
    article.append(disclosure(message.command || 'Shell output', message.output || ''));
  } else {
    const content = typeof message.content === 'string' ? [{type: 'text', text: message.content}] : (message.content || []);
    for (const block of content) {
      if (block.type === 'text') article.append(element('div', block.text, 'message-text'));
      else if (block.type === 'thinking' && block.thinking) article.append(disclosure('Thinking', block.thinking));
      else if (block.type === 'toolCall') article.append(disclosure('Tool: ' + block.name, JSON.stringify(block.arguments, null, 2)));
      else if (block.type === 'image') article.append(element('p', '[Image attachment]'));
    }
    if (message.summary) article.append(element('div', message.summary, 'message-text'));
    if (message.errorMessage) article.append(element('p', message.errorMessage));
  }
  // Stable detail IDs let open disclosures survive streaming updates.
  article.querySelectorAll('details').forEach((d, i) => d.dataset.key = index + ':' + i);
  return article;
}
function controls() {
  $('text').disabled = !selected;
  $('send').disabled = !selected || busy || sending;
  $('stop').hidden = !busy;
}
function select(id) {
  if (selected) drafts.set(selected, $('text').value);
  selected = id;
  $('text').value = drafts.get(id) || '';
  signature = dialogSignature = '';
  requestError = backendError = connectionError = '';
  busy = false;
  $('transcript').replaceChildren();
  $('dialogs').replaceChildren();
  $('title').textContent = 'Loading conversation…';
  $('meta').textContent = '';
  $('app').classList.remove('menu-open');
  $('mobile-toggle').setAttribute('aria-expanded', 'false');
  history.replaceState(null, '', '/?c=' + encodeURIComponent(id));
  controls(); showError();
  poll();
}
function renderDialogs(dialogs) {
  const key = JSON.stringify(dialogs);
  if (key === dialogSignature) return;
  dialogSignature = key;
  $('dialogs').replaceChildren();
  for (const d of dialogs) {
    const form = element('form'), fieldset = element('fieldset');
    fieldset.append(element('legend', d.title || 'Pi needs your input'));
    if (d.message) fieldset.append(element('p', d.message));
    let input;
    if (d.method === 'select') {
      input = element('select');
      for (const option of d.options || []) input.append(element('option', option));
    } else if (d.method !== 'confirm') {
      input = element(d.method === 'editor' ? 'textarea' : 'input');
      input.value = d.prefill || '';
      input.placeholder = d.placeholder || '';
    }
    if (input) { input.setAttribute('aria-label', d.title || 'Response'); fieldset.append(input); }
    const yes = element('button', d.method === 'confirm' ? 'Yes' : 'Submit');
    fieldset.append(yes);
    const cancel = element('button', 'Cancel'); cancel.type = 'button'; fieldset.append(cancel);
    const id = selected;
    async function answer(cancelled) {
      try {
        await api('/chat/answer', {id, request: d.id, value: input ? input.value : 'yes', cancel: cancelled ? '1' : '0'});
        requestError = ''; poll();
      } catch (e) { requestError = e.message; showError(); }
    }
    form.onsubmit = ev => { ev.preventDefault(); answer(false); };
    cancel.onclick = () => answer(true);
    form.append(fieldset); $('dialogs').append(form);
  }
}
async function poll() {
  if (polling) return;
  polling = true;
  const id = selected;
  try {
    const list = await api('/chat/list');
    $('connection').textContent = 'Connected';
    connectionError = ''; showError();
    $('conversations').replaceChildren();
    for (const c of list) {
      const a = element('a', c.name + (c.busy ? ' …' : ''));
      a.append(element('small', (c.machine || 'hub') + ' · ' + c.cwd));
      a.href = '/?c=' + encodeURIComponent(c.id);
      if (c.id === selected) a.setAttribute('aria-current', 'page');
      a.onclick = ev => { if (!ev.ctrlKey && !ev.metaKey) { ev.preventDefault(); select(c.id); } };
      $('conversations').append(a);
    }
    if (!id) return;
    const state = await api('/chat/state?id=' + encodeURIComponent(id));
    if (selected !== id) return;
    busy = state.busy;
    backendError = state.error || ''; showError();
    $('title').textContent = state.name;
    $('meta').textContent = 'Model: ' + (state.model || 'loaded when you send a message') +
      (state.thinking ? ' · Thinking: ' + state.thinking : '') +
      '\n' + (state.machine || 'hub') + ' : ' + state.cwd;
    $('meta').style.whiteSpace = 'pre-line';
    $('notice').hidden = !!state.messages.length || !!state.partial;
    $('notice').textContent = 'Send a message to begin.';
    $('status').textContent = sending ? 'Sending…' : busy ? (state.activity || 'Pi is working…') :
      'Ready · Ctrl/⌘ + Enter to send';
    const next = JSON.stringify([state.messages, state.partial]);
    if (next !== signature) {
      const panel = $('messages');
      const bottom = panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 80;
      const opened = new Set([...$('transcript').querySelectorAll('details[open]')].map(d => d.dataset.key));
      const fragment = document.createDocumentFragment();
      [...state.messages, ...(state.partial ? [state.partial] : [])].forEach((m, i) => {
        const el = renderMessage(m, i, i === state.messages.length);
        if (el) fragment.append(el);
      });
      $('transcript').replaceChildren(fragment);
      $('transcript').querySelectorAll('details').forEach(d => { d.open = opened.has(d.dataset.key); });
      if (bottom || !signature) panel.scrollTop = panel.scrollHeight;
      signature = next;
    }
    renderDialogs(state.dialogs || []);
    controls();
  } catch (e) {
    if (selected === id) { $('connection').textContent = 'Disconnected · retrying…'; connectionError = e.message; showError(); }
  } finally {
    polling = false;
    if (selected !== id) poll();
  }
}
$('new-toggle').onclick = () => {
  $('new-form').hidden = !$('new-form').hidden;
  $('new-toggle').setAttribute('aria-expanded', String(!$('new-form').hidden));
  if (!$('new-form').hidden) $('new-form').elements.name.focus();
};
$('new-form').onsubmit = async ev => {
  ev.preventDefault();
  const button = ev.currentTarget.querySelector('button'); button.disabled = true;
  try {
    const c = await api('/chat/new', Object.fromEntries(new FormData($('new-form'))));
    $('new-form').reset(); $('new-form').hidden = true;
    $('new-toggle').setAttribute('aria-expanded', 'false');
    select(c.id); $('text').focus();
  } catch (e) { requestError = e.message; showError(); }
  finally { button.disabled = false; }
};
$('composer').onsubmit = async ev => {
  ev.preventDefault();
  const text = $('text').value, id = selected;
  if (!id || !text.trim() || sending || busy) return;
  sending = true; requestError = ''; showError(); controls();
  $('status').textContent = 'Sending…';
  try {
    await api('/chat/send', {id, text});
    // Do not erase text typed while awaiting acknowledgement, or another chat's draft.
    drafts.delete(id);
    if (selected === id && $('text').value === text) $('text').value = '';
  } catch (e) { requestError = e.message; showError(); }
  finally { sending = false; controls(); poll(); }
};
$('stop').onclick = async () => {
  $('stop').disabled = true;
  try { await api('/chat/stop', {id: selected}); requestError = ''; }
  catch (e) { requestError = e.message; showError(); }
  finally { $('stop').disabled = false; poll(); }
};
$('text').onkeydown = ev => {
  if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); $('composer').requestSubmit(); }
};
$('mobile-toggle').onclick = () => {
  const open = $('app').classList.toggle('menu-open');
  $('mobile-toggle').setAttribute('aria-expanded', String(open));
};
api('/chat/machines').then(list => {
  for (const m of list) $('machine').append(element('option', m));
}).catch(() => {});
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
